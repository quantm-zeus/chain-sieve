deliverables:
  - proof-carrying task results and independently revalidated cluster verification
  - deterministic forgery, mutation, copied-result, stale-lease, and reachability regressions
  - exact Node.js 22 runtime baseline with drift prevention
  - production API and dashboard images for linux/amd64 and linux/arm64
  - executable task lifecycle commands and generated-goal command validation
  - correlation IDs on all API and MCP response paths
  - deterministic cancellable MCP timeout regression tool available only in test mode
  - exact prompt archive manifest without fabricated dates
  - owned-file formatting policy and clean baseline
  - drizzle-orm patched to at least 0.45.2 with database regressions
  - authenticated GitHub control evidence or explicit permission blocker
  - immutable release repair report and resolution record
required_tests:
  - tests/harness/verifier-forgery.spec.ts
  - tests/harness/cluster-verifier-forgery.spec.ts
