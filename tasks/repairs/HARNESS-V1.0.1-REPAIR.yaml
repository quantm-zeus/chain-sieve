  - docker buildx build --platform linux/amd64 --file apps/api/Dockerfile .
  - docker buildx build --platform linux/arm64 --file apps/api/Dockerfile .
  - docker buildx build --platform linux/amd64 --file apps/dashboard/Dockerfile .
  - docker buildx build --platform linux/arm64 --file apps/dashboard/Dockerfile .
rollback_strategy:
  - revert repair commits in reverse category order without rewriting history
  - leave harness-v1.0.0 and its evidence untouched
  - do not create harness-v1.0.1 unless independent clean-room verification passes
  - no database migration is authorized or required
stop_conditions:
  - any authoritative source hash drifts
  - harness-v1.0.0 tag object or target changes
  - repair requires a forbidden product package or Crypto Intelligence cluster implementation
  - an exclusive lock conflicts with another active lease
  - the repair lease is stale, lost, or cannot be fenced
  - required safety semantics are unclear or proof-carrying evidence cannot fail closed
  - a required migration becomes necessary without a persistence-owned amendment
  - a P0 or P1 finding remains after self-review
  - GitHub mutation is requested without successful authentication and API authorization
  - final verification is not performed on exact Node.js 22 with a clean tracked tree
completion_definition:
  - all eleven finding IDs have a truthful RESOLVED or externally BLOCKED disposition with evidence
  - every P0 and P1 code/repository finding is resolved
  - every required local command passes from a clean Node.js 22 environment
  - both production images build and smoke-test on linux/amd64 and linux/arm64
  - task and cluster forgery suites reject every controlled case for the expected reason
  - compiler output is byte-for-byte deterministic and generated goals reference only valid lifecycle commands
  - release reports bind the contract, sources, base commit, head commit, tree, and evidence hashes
  - repair branch is pushed and merged only through an approved protected workflow
  - final patch tag is withheld for independent clean-room attestation
budgets:
  max_files: 80
  max_changed_lines: 8000
  max_migrations: 0
  max_product_packages: 0
  require_owner_amendment_above_budget: true
bootstrap_note: >-
  The pre-repair task runner only discovers generated G0-G7 JSON contracts and hard-codes
  task/<id> branches. This owner-approved repair contract therefore authorizes only the
  minimum runner/schema change needed to discover, acquire, fence, and verify this YAML
  repair task on the approved fix/harness-v1.0.1-attestation branch before further repair work.
