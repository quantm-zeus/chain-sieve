name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['harness-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tier0:
    name: Tier 0 · static and unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
  tier1:
    name: Tier 1 · task contracts
    needs: tier0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm spec:verify
      - run: pnpm prd:drift-check
      - run: pnpm requirements:coverage
      - run: pnpm harness:verify
      - name: Verify runtime, generated goals, and proof-carrying rejection
        run: pnpm exec vitest run tests/harness/runtime-baseline.spec.ts tests/harness/compiler.spec.ts tests/harness/verifier-forgery.spec.ts tests/harness/cluster-verifier-forgery.spec.ts
  tier2:
    name: Tier 2 · cluster integration
    needs: tier1
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: ciag, POSTGRES_PASSWORD: ciag_test, POSTGRES_DB: ciag }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ciag" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Start MinIO and wait for API readiness
        run: |
          docker run --detach --name ciag-minio --publish 127.0.0.1:9000:9000 --publish 127.0.0.1:9001:9001 --env MINIO_ROOT_USER=ciag --env MINIO_ROOT_PASSWORD=ciag_test_only minio/minio:RELEASE.2025-07-23T15-54-02Z server /data --console-address ':9001'
          node <<'NODE'
          const endpoint = 'http://127.0.0.1:9000/minio/health/ready';
          const deadline = Date.now() + 30_000;
          let lastError = 'no response';
          for (;;) {
            try {
              const response = await fetch(endpoint);
              if (response.ok) break;
              lastError = `HTTP ${response.status}`;
            } catch (error) {
              lastError = error instanceof Error ? error.message : String(error);
            }
            if (Date.now() >= deadline) throw new Error(`MinIO did not become ready at ${endpoint}: ${lastError}`);
            await new Promise((resolve) => setTimeout(resolve, 500));
          }
          NODE
      - run: docker exec ciag-minio mc alias set local http://127.0.0.1:9000 ciag ciag_test_only && docker exec ciag-minio mc mb --ignore-existing local/ciag-artifacts
      - run: pnpm test:integration
      - run: pnpm test:system
      - run: pnpm test:service
        env:
          CIAG_TEST_DATABASE_URL: postgres://ciag:ciag_test@127.0.0.1:5432/ciag
          CIAG_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          CIAG_TEST_S3_BUCKET: ciag-artifacts
          CIAG_TEST_S3_ACCESS_KEY_ID: ciag
          CIAG_TEST_S3_SECRET_ACCESS_KEY: ciag_test_only
      - run: pnpm migration:verify
      - run: pnpm architecture:verify
      - run: pnpm placeholders:scan
      - run: pnpm prohibited-capabilities:scan
      - run: pnpm harness:lifecycle
      - name: Reject unimplemented task and cluster completion
        run: |
          if pnpm task:verify T-G0-CORE --holder forged --lease-version 1; then exit 1; fi
          if pnpm cluster:verify C-G0-IMPLEMENTATION; then exit 1; fi
  tier3:
    name: Tier 3 · pre-main
    needs: [tier2, production-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm prd:compile
      - run: pnpm prd:drift-check
      - run: pnpm requirements:coverage
      - run: pnpm architecture:verify
      - run: pnpm migration:verify
      - run: pnpm harness:verify
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm placeholders:scan
      - run: pnpm tests:skeleton-integrity
      - run: pnpm test:mutation
  production-images:
    name: Tier 3 · production image (${{ matrix.service }}, ${{ matrix.platform }})
    needs: tier2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, dashboard]
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build exact production image
        run: docker buildx build --platform "${{ matrix.platform }}" --load --file "apps/${{ matrix.service }}/Dockerfile" --tag "chain-sieve-${{ matrix.service }}:ci" .
      - name: Verify and smoke production image
        shell: bash
        run: |
          set -euo pipefail
          image="chain-sieve-${{ matrix.service }}:ci"
          expected_arch="${{ matrix.platform }}"
          expected_arch="${expected_arch#linux/}"
          test "$(docker image inspect "$image" --format '{{.Architecture}}')" = "$expected_arch"
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = node
          if [ "${{ matrix.service }}" = api ]; then
            docker run -d --name production-smoke --read-only --tmpfs /tmp:rw,size=64m -p 13000:3000 \
              -e NODE_ENV=production -e API_HOST=0.0.0.0 -e API_PORT=3000 \
              -e DATABASE_URL=postgres://ciag:ciag_test@127.0.0.1:5432/ciag \
              -e OBJECT_STORE_DRIVER=filesystem -e OBJECT_STORE_ROOT=/tmp/object-store \
              -e MCP_ALLOWED_ORIGINS=http://127.0.0.1:3001 \
              -e MCP_BOOTSTRAP_TOKEN=local-synthetic-bootstrap-token "$image"
            endpoint=http://127.0.0.1:13000/api/v1/health
          else
            docker run -d --name production-smoke --read-only --tmpfs /tmp:rw,size=32m -p 13001:3001 \
              -e NODE_ENV=production -e HOST=0.0.0.0 -e PORT=3001 \
              -e ORIGIN=http://127.0.0.1:13001 -e PUBLIC_API_BASE_URL=http://127.0.0.1:3000 "$image"
            endpoint=http://127.0.0.1:13001/
          fi
          for attempt in {1..30}; do curl --fail --silent --show-error "$endpoint" >/dev/null && break; sleep 1; done
          curl --fail --silent --show-error "$endpoint" >/dev/null
          test "$(docker inspect production-smoke --format '{{.HostConfig.ReadonlyRootfs}}')" = true
          docker exec production-smoke sh -lc 'test ! -e /pnpm/store && test ! -d /app/node_modules && test ! -d /app/tests'
          docker stop --time 10 production-smoke
          test "$(docker inspect production-smoke --format '{{.State.ExitCode}}')" = 0
